<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sillage</title>
<meta name="description" content="Weather-aware daily fragrance pick, collection advisor and wear journal.">
<meta name="theme-color" content="#0e0d0b"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=Jost:wght@300..600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<style>
/* Layout: app shell — sticky header, single content column (max 1080px), bottom tab bar on phones, left rail on desktop.
   One committed dark look (per the brief): warm near-black ground, ivory type, muted gold and bronze. */
:root {
  color-scheme: dark;
  --bg: #0e0d0b;
  --surface: #161411;
  --surface-2: #1d1a16;
  --surface-3: #262119;
  --line: #2a251e;
  --line-2: #3a3329;
  --ivory: #f1e9da;
  --ivory-2: #cbc0ad;
  --mute: #958a78;
  --gold: #c9a66b;
  --gold-2: #e6cb98;
  --bronze: #a2703f;
  --good: #9cbb8e;
  --warn: #dcab55;
  --bad: #d4806a;
  --info: #93acc4;
  --info-soft: #233040;
  --glass: rgba(241, 233, 218, 0.07);
  --glass-edge: rgba(241, 233, 218, 0.35);
  --cap: #1b1814;
  --f-display: 'Bodoni Moda', 'Didot', 'Bodoni 72', 'Bodoni MT', Georgia, serif;
  --f-ui: 'Jost', 'Futura', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r: 10px;
  --r-lg: 16px;
  --nav-h: 64px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ivory); }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--gold-2); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-weight: 500; text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--mute); }
.dim { color: var(--ivory-2); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
.display { font-family: var(--f-display); font-weight: 500; letter-spacing: -.01em; }
[hidden] { display: none !important; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 56px; }
.wordmark { font-family: var(--f-display); font-size: 19px; letter-spacing: .02em; white-space: nowrap; }
.wordmark em { font-style: italic; color: var(--gold); }
.topbar .spacer { flex: 1; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; color: var(--ivory-2); }
.icon-btn:hover { color: var(--ivory); border-color: var(--gold); }
.icon-btn svg, .tab svg, .rail a svg { width: 20px; height: 20px; }
.save-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
.save-dot.local { background: var(--info); } .save-dot.memory { background: var(--bad); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.view { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.view > *, .grid-2 > *, .grid-3 > *, .stack > * { min-width: 0; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.view-head > * { min-width: 0; max-width: 100%; }
.view-head h1 { font-family: var(--f-display); font-size: clamp(28px, 6vw, 40px); line-height: 1.05; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--surface) 96%, transparent);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.tabbar-in { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 560px; margin: 0 auto; height: var(--nav-h); }
.tab { display: grid; place-items: center; align-content: center; gap: 3px; text-decoration: none; color: var(--mute); font-size: 11px; letter-spacing: .04em; }
.tab[aria-current="page"] { color: var(--gold-2); }
.rail { display: none; }

@media (min-width: 980px) {
  .app { grid-template-columns: 216px 1fr; }
  .rail { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--line); background: var(--surface); }
  .rail .wordmark { padding: 0 10px 22px; font-size: 21px; }
  .rail a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--ivory-2); text-decoration: none; }
  .rail a:hover { background: var(--surface-2); color: var(--ivory); }
  .rail a[aria-current="page"] { background: var(--surface-3); color: var(--gold-2); }
  .rail .rail-foot { margin-top: auto; padding: 10px 12px; }
  .tabbar, .topbar .wordmark, .topbar .nav-extra { display: none; }
  main { padding-bottom: 40px; }
}

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; min-width: 0; }
.card.flat { background: transparent; }
.card h2 { font-family: var(--f-display); font-size: 22px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 18px; }
.grid-3 { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 760px) { .grid-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.hr { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ivory); cursor: pointer; text-decoration: none; font-size: 14px; letter-spacing: .02em; }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #1a1408; font-weight: 500; }
.btn.primary:hover { background: var(--gold-2); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); color: var(--bad); background: transparent; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-2);
  background: transparent; color: var(--ivory-2); cursor: pointer; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"], .chip.on { background: var(--surface-3); border-color: var(--gold); color: var(--gold-2); }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; min-width: 0; max-width: 100%; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; letter-spacing: .05em; border: 1px solid var(--line-2); color: var(--ivory-2); white-space: nowrap; }
.src { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--mute); white-space: nowrap; }
.src.brand { color: var(--gold-2); border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
.src.community { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, var(--line)); }
.src.mine { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.src.estimate { color: var(--mute); border-style: dashed; }
.src.research { color: #c9b3e0; border-color: #4a4058; }
.conf { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid; }
.conf.High { color: var(--good); border-color: color-mix(in srgb, var(--good) 55%, transparent); }
.conf.Medium { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.conf.Low { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, transparent); }

label.field { display: grid; gap: 6px; font-size: 13px; color: var(--ivory-2); min-width: 0; }
.input, select.input, textarea.input { width: 100%; min-height: 42px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ivory); }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { border-color: var(--gold); outline: none; }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.form-grid.wide { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.range-row { display: grid; grid-template-columns: minmax(96px, 140px) 1fr 34px; align-items: center; gap: 10px; font-size: 13px; color: var(--ivory-2); }
input[type=range] { width: 100%; accent-color: var(--gold); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.switch:last-child { border-bottom: 0; }
.switch input { width: 20px; height: 20px; accent-color: var(--gold); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 999px; }
.stepper button { width: 40px; height: 40px; border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--ivory); }
.stepper output { min-width: 34px; text-align: center; font-family: var(--f-mono); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; cursor: pointer; color: var(--ivory-2); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--gold-2); }

/* ---------- Weather strip ---------- */
.wx { display: grid; gap: 14px; }
.wx-main { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.wx-temp { font-family: var(--f-display); font-size: 64px; line-height: .9; }
.wx-temp sup { font-size: 26px; vertical-align: top; position: relative; top: 8px; color: var(--ivory-2); }
.wx-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px 14px; flex: 1; min-width: 220px; }
.fact { display: grid; gap: 1px; }
.fact .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.fact .v { font-family: var(--f-mono); font-size: 15px; color: var(--ivory); font-variant-numeric: tabular-nums; }
.fact .v small { font-family: var(--f-ui); color: var(--ivory-2); font-size: 12px; }
.notice { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 12px 14px; color: var(--ivory-2); font-size: 13.5px; background: var(--surface-2); }
.notice.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }

/* ---------- Scent of the Day ---------- */
.sotd { position: relative; overflow: hidden; padding: 22px; background:
  radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--bronze) 22%, transparent), transparent 60%), var(--surface); border-color: var(--line-2); }
.sotd-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.sotd-name { font-family: var(--f-display); font-size: clamp(32px, 8vw, 48px); line-height: 1; letter-spacing: -.015em; }
.sotd-brand { color: var(--ivory-2); margin-top: 6px; font-size: 14px; }
.ring-num { font-family: var(--f-display); font-size: 26px; fill: var(--ivory); }
.dose { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; padding: 14px 0; border-block: 1px solid var(--line); margin-top: 16px; }
.dose-n { font-family: var(--f-display); font-size: 44px; line-height: 1; color: var(--gold-2); }
.dose-n small { font-family: var(--f-ui); font-size: 13px; color: var(--ivory-2); display: block; letter-spacing: .08em; text-transform: uppercase; }
.why { display: grid; gap: 9px; margin: 14px 0 0; padding: 0; list-style: none; }
.why li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; color: var(--ivory-2); font-size: 14.5px; }
.why li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-top: 8px; }
.why li.caveat::before { background: transparent; border: 1px solid var(--warn); }
.issues { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.issues li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; font-size: 13.5px; color: var(--ivory-2); }
.issues li::before { content: "i"; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--info); color: var(--info); font-size: 10px; margin-top: 2px; font-family: var(--f-mono); }
.issues li.warn::before { content: "!"; border-color: var(--warn); color: var(--warn); }
.perf-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.perf-strip .fact { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); }
.factors { display: grid; gap: 4px; }
.factor { display: grid; grid-template-columns: minmax(118px, 160px) 1fr 38px; gap: 10px; align-items: center; padding: 7px 0; border: 0; background: transparent; text-align: left; cursor: pointer; color: inherit; width: 100%; }
.factor .fl { font-size: 13px; color: var(--ivory-2); }
.factor .fl small { color: var(--mute); font-family: var(--f-mono); margin-left: 4px; }
.factor .fv { font-family: var(--f-mono); font-size: 13px; text-align: right; }
.factor-detail { font-size: 13px; color: var(--mute); padding: 0 0 8px; }
.bar-track { position: relative; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; display: block; }
.bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--gold); }
.bar-fill.mid { background: var(--warn); } .bar-fill.low { background: var(--bad); } .bar-fill.neutral { background: var(--line-2); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

.alts { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .alts { grid-template-columns: repeat(3, 1fr); } }
.alt { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; cursor: pointer; text-align: left; width: 100%; color: inherit; font: inherit; }
.alt:hover { border-color: var(--gold); }
.alt-name { font-family: var(--f-display); font-size: 21px; line-height: 1.1; }
.alt-score { font-family: var(--f-mono); color: var(--gold-2); font-size: 18px; }

/* ---------- Timeline ---------- */
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 78px 14px 1fr; gap: 10px; align-items: start; padding: 8px 0; }
.tl-time { font-family: var(--f-mono); font-size: 12.5px; color: var(--ivory-2); padding-top: 2px; }
.tl-dot { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; border: 1.5px solid var(--gold); background: var(--bg); position: relative; }
.tl-dot.out { border-color: var(--info); }
.tl-body { display: grid; gap: 2px; min-width: 0; }
.tl-title { font-size: 14.5px; }
.tl-meta { font-size: 12.5px; color: var(--mute); }

/* ---------- Charts ---------- */
.chart-wrap { width: 100%; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.chart-scroll .chart { width: auto; max-width: none; }
.ch-tick { font-family: var(--f-mono); font-size: 10.5px; fill: var(--mute); }
.ch-now { fill: var(--gold-2); }
.ch-rain { fill: var(--info); }
.ch-val { font-family: var(--f-mono); font-size: 10.5px; fill: var(--ivory-2); }
.ch-band { font-family: var(--f-ui); font-size: 10px; fill: var(--ivory-2); }
.ch-note { font-family: var(--f-mono); font-size: 10px; fill: var(--gold-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--mute); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.sw-gold { background: var(--gold); }
.sw-dash { background: repeating-linear-gradient(90deg, var(--ivory-2) 0 5px, transparent 5px 8px); }
.sw-bad { background: var(--bad); height: 9px; opacity: .5; }
.sw-info-dash { background: repeating-linear-gradient(90deg, var(--info) 0 4px, transparent 4px 7px); }
.sw-info-soft { background: var(--info); opacity: .3; height: 9px; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
.bar-label { color: var(--ivory-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-val { font-family: var(--f-mono); text-align: right; font-size: 12.5px; }
.radar-wrap { max-width: 420px; margin: 0 auto; }
.dewscale { display: grid; gap: 4px; }
.dew-track { position: relative; height: 10px; border-radius: 10px; background: linear-gradient(90deg, #8a6f4a 0%, #6f7d64 40%, #5f7f8c 66%, #46648a 83%, #3b4f86 100%); }
.dew-mark { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; background: var(--ivory); border-radius: 2px; box-shadow: 0 0 0 2px var(--bg); }
.dew-labels { position: relative; height: 16px; font-size: 10.5px; color: var(--mute); font-family: var(--f-mono); }
.dew-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.dew-labels span:first-child { transform: none; }
.dew-labels span:last-child { transform: translateX(-100%); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--mute); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.cell { display: inline-grid; place-items: center; min-width: 44px; height: 28px; border-radius: 6px; font-family: var(--f-mono); font-size: 12.5px; }

/* ---------- Collection ---------- */
.coll-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.fcard { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%; }
.fcard:hover { border-color: var(--gold); }
.fcard .fname { font-family: var(--f-display); font-size: 22px; line-height: 1.05; }
.fcard .fmeta { font-size: 12.5px; color: var(--ivory-2); }
.fcard.add { grid-template-columns: 1fr; place-items: center; min-height: 150px; border-style: dashed; color: var(--gold-2); }
.bottle-photo { object-fit: cover; border-radius: 10px; border: 1px solid var(--line-2); max-width: 100%; }
.flacon { display: block; flex: none; max-width: 100%; }
.remain { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 11.5px; color: var(--mute); }
.pyramid { display: grid; gap: 10px; }
.tier { display: grid; grid-template-columns: 62px 1fr; gap: 12px; align-items: baseline; }
.tier .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }

  // ---- Application advice ----------------------------------------------------
  function applicationSpots(day, sprays) {
    const acts = new Set(day.activities);
    const tight = Math.min(...day.blocks.filter((b) => b.act.relevance >= 0.9).map((b) => b.tolerance), 9);
    const coldOut = day.outdoor && day.outdoor.meanF < 50;
    const dryIn = day.blocks.some((b) => b.isIndoor && b.cond.rh < 28 && b.act.relevance >= 0.9);
    const hot = day.outdoor && day.outdoor.wakeMaxF >= 85;
    const spots = [];
    if (tight < 5) spots.push('Chest, under your shirt', 'Back of the neck');
    else spots.push('Sides of the neck', 'Chest, under your shirt');
    if (sprays >= 4) spots.push(hot ? 'Back of the neck' : 'Inner forearm');
    if ((coldOut || dryIn) && sprays >= 3) spots.push('One on your jacket or collar fabric');
    const unique = [...new Set(spots)].slice(0, Math.max(1, sprays));
    const tips = [];
    if (acts.has('work')) tips.push('Skip the wrists — handwashing and sanitizer at work strip them.');
    if (dryIn || coldOut) tips.push('Dry air shortens wear; unscented moisturizer first helps.');

  // ---- Full evaluation for one fragrance ------------------------------------

  function rotation(frag, stats, nFrags, today, settings, raw) {

    let adj = 0; const why = [];

      else if (d === 2) { adj -= 4; why.push('worn 2 days ago'); }
      else if (d === 3) { adj -= 2; why.push('worn 3 days ago'); }
      else if (d >= 14) { adj += 2; why.push(`not worn in ${d} days`); }
    }
    const total = Object.values(stats).reduce((a, x) => a + x.recent30, 0);
    if (total >= 4 && s.recent30 / total > 1.5 / Math.max(1, nFrags)) { adj -= 2; why.push(`${s.recent30} of your last ${total} wears`); }

    if (day.assumptions.length) { s -= Math.min(12, 3 * day.assumptions.length); why.push(`Indoor conditions assumed for ${day.assumptions.join(', ')}`); }

  function explain(res, all, weights) {

    const contrib = keys.map((k) => ({ k, d: (res.factors[k].score - means[k]) * (weights[k] || 0) / 100, s: res.factors[k].score }))

    if (!lines.length) lines.push({ k: contrib[0].k, text: res.factors[contrib[0].k].reason });
    const weak = keys.map((k) => ({ k, s: res.factors[k].score, c: res.factors[k].concern })).filter((x) => x.c).sort((a, b) => a.s - b.s)[0];
    return { lines, caveat: weak ? { k: weak.k, text: weak.c } : null };

  function recommend({ settings, frags, journal, weather, date, occasion, blocks, appliedAt }) {

    const byFinal = (l) => l.slice().sort((x, y) => y.final - x.final);
    const overall = others[0] || null;

        <span class="row"><span class="src ${w.source === 'manual' ? 'mine' : 'brand'}">${w.source === 'manual' ? 'Manual' : 'Live'}</span><span class="muted xs">${esc(srcLine)}</span>
        ${w.source === 'manual' ? '<button class="btn sm" data-act="wx-manual">Update</button>' : `<button class="icon-btn" data-act="wx-refresh" aria-label="Refresh forecast">${icon('refresh')}</button>`}</span></div>
      <div class="wx-main"><div><div class="wx-temp num">${r0(c.tempF)}<sup>°F</sup></div><div class="dim small">${esc(desc.text || '')}${Number.isFinite(c.feelsF) && Math.abs(c.feelsF - c.tempF) >= 2 ? ` · feels ${deg(c.feelsF)}` : ''}</div></div>
      <div class="wx-facts">
        <div class="fact"><span class="k">High / Low</span><span class="v">${deg(dd.highF)} / ${deg(dd.lowF)}</span></div>
        <div class="fact"><span class="k">Humidity</span><span class="v">${r0(c.rh)}%</span></div>
        <div class="fact"><span class="k">Dew point</span><span class="v">${deg(c.dewF)} <small>${esc(band.label)}</small></span></div>
        ${compact ? '' : `<div class="fact"><span class="k">Wind</span><span class="v">${Number.isFinite(c.windMph) ? r0(c.windMph) + ' mph' : '—'} <small>${W.compass(c.windDir)}</small></span></div>`}
        <div class="fact"><span class="k">Rain chance</span><span class="v">${Number.isFinite(dd.precipProb) ? r0(dd.precipProb) + '%' : Number.isFinite(c.precipProb) ? r0(c.precipProb) + '%' : '—'}</span></div>
        ${compact ? '' : `<div class="fact"><span class="k">UV max</span><span class="v">${Number.isFinite(dd.uvMax) ? U.round(dd.uvMax, 1) : '—'}</span></div><div class="fact"><span class="k">Cloud</span><span class="v">${Number.isFinite(c.cloud) ? r0(c.cloud) + '%' : '—'}</span></div><div class="fact"><span class="k">Precip now</span><span class="v">${Number.isFinite(c.precipIn) ? U.round(c.precipIn, 2) + ' in' : '—'}</span></div>`}
      </div></div>${S.geo.status === 'denied' && !G.claude ? `<p class="muted xs">Location access is off for Sillage, so this uses ${esc(S.settings.location.name)}. Turn it on in your phone’s app settings for Sillage (Permissions → Location).</p>` : ''}</section>`;
  }
  V.weatherCard = weatherCard;

  function occasionChips() {
    const cur = S.day.occasion || 'day';
    return `<div class="chips scroll" role="group" aria-label="Recommend for">${Object.entries(C.OCCASIONS).map(([k, o]) => `<button class="chip" data-act="occasion" data-v="${k}" aria-pressed="${cur === k}">${esc(o.label)}</button>`).join('')}</div>`;
  }

  function factorRows(r, weights) {
    const keys = Object.keys(C.DEFAULT_WEIGHTS);
    return `<div class="factors">${keys.map((k) => {
      const f = r.factors[k]; const open = S.ui.openFactor === k;
      return `<button class="factor" data-act="factor" data-k="${k}" aria-expanded="${open}"><span class="fl">${esc(C.FACTOR_LABELS[k])}<small>${Math.round(weights[k])}%</small></span>${pctBar(f.score, k === 'history' && !f.conf)}<span class="fv">${k === 'history' && !f.conf ? '<span class="muted">50</span>' : r0(f.score)}</span></button>
        ${open ? `<div class="factor-detail">${esc(f.reason)}${f.concern ? `<br><span style="color:var(--warn)">${esc(f.concern)}</span>` : ''}${k === 'history' && f.n === 0 ? '<br>Log a few wears and this starts to count.' : ''}</div>` : ''}`;
    }).join('')}</div>`;
  }

  function sotdCard() {
    const rec = S.rec;
    if (!rec || !rec.primary) return '';
    const choice = S.day.choice;
    const picked = choice && choice.fragId ? App.resultFor(choice.fragId) : null;
    const r = picked || rec.primary;
    const isEngine = r.id === rec.primary.id;
    const entry = App.todayEntry();
    const wearing = entry && entry.fragranceId === r.id;
    const day = rec.day;
    const exp = r.expected;
    const ex = isEngine ? rec.primary.explanation : null;
    const lines = ex ? ex.lines.map((l) => `<li>${esc(l.text)}</li>`).join('') + (ex.caveat ? `<li class="caveat">${esc(ex.caveat.text)}</li>` : '')
      : ['weather', 'space', 'humidity'].map((k) => `<li class="${r.factors[k].concern ? 'caveat' : ''}">${esc(r.factors[k].concern || r.factors[k].reason)}</li>`).join('');
    const conf = isEngine ? rec.primary.confidence : null;
    const longSrc = String(r.longevity.src).startsWith('blend') ? `blend of estimate + ${r.longevity.src.split(':')[1]} of your logs` : 'estimate';
    const rot = r.rotation && r.rotation.adj ? `<p class="muted xs">Rotation ${r.rotation.adj > 0 ? '+' : ''}${r.rotation.adj} pts (${esc(r.rotation.reason)}).</p>` : '';
    return `<section class="card sotd fade-in" aria-labelledby="sotd-name">
      <div class="sotd-top">${Ch.bottle(r.frag, 62)}
        <div style="min-width:0"><div class="eyebrow">${isEngine ? (picked ? 'Your pick · also the top score' : 'Scent of the day') : 'Your pick today'} · ${esc(day.occasionLabel)}</div>
          <h2 class="sotd-name" id="sotd-name">${esc(r.frag.name)}</h2><p class="sotd-brand">${esc(r.frag.brand)} · ${esc(r.frag.concentration || '')}</p></div>
        ${Ch.scoreRing(r.final, 74, 'Recommendation score')}</div>
      ${conf ? `<div class="row" style="margin-top:12px"><span class="conf ${conf.level}" data-act="conf-info">${conf.level} confidence</span><span class="muted xs">${esc(conf.reasons.slice(0, 2).join(' · '))}</span></div>` : `<p class="small dim" style="margin-top:10px">Engine’s pick was <a href="#" data-act="wear-engine">${esc(rec.primary.frag.name)}</a> (${r0(rec.primary.final)} vs ${r0(r.final)}).</p>`}
      <div class="dose"><div class="dose-n">${r.sprays}<small>spray${r.sprays > 1 ? 's' : ''}</small></div>
        <div class="stack" style="gap:4px"><div>${r.application.spots.map(esc).join(' · ')}</div>${r.application.tips.slice(0, 2).map((t) => `<div class="muted small">${esc(t)}</div>`).join('')}</div></div>
      <ul class="why">${lines}</ul>
      <div style="margin-top:16px">${Ch.dayChart(r, day)}</div>
      <div class="perf-strip" style="margin-top:12px">
        <div class="fact"><span class="k">Expected wear</span><span class="v">~${U.round(r.longevity.lo, 0)}–${U.round(r.longevity.hi, 0)} h</span><span class="muted xs">${esc(longSrc)}</span></div>
        <div class="fact"><span class="k">Opening</span><span class="v">${esc(E.levelWord(exp.opening))}</span><span class="muted xs">~${U.round(exp.opening, 1)}/10</span></div>
        ${exp.first ? `<div class="fact"><span class="k">${esc(exp.first.label)}</span><span class="v">${esc(E.levelWord(exp.first.mean))}</span><span class="muted xs">~${U.round(exp.first.mean, 1)}/10 avg</span></div>` : ''}
        ${exp.lastMajor && exp.lastMajor !== exp.first ? `<div class="fact"><span class="k">${esc(exp.lastMajor.label)}</span><span class="v">${esc(E.levelWord(exp.lastMajor.mean))}</span><span class="muted xs">~${U.round(exp.lastMajor.mean, 1)}/10 avg</span></div>` : ''}
      </div>
      ${r.issues.length ? `<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">Watch for</div><ul class="issues">${r.issues.slice(0, 5).map((i) => `<li class="${i.level}">${esc(i.text)}</li>`).join('')}</ul></div>` : ''}
      <div style="margin-top:16px"><div class="row between" style="margin-bottom:6px"><span class="eyebrow">How it scored</span><span class="muted xs">${S.rec.adaptive.active ? 'Weights adapted to your logs' : 'Starting weights'} · tap a row</span></div>${factorRows(r, S.rec.weights)}${rot}</div>
      <div class="actions">
        ${wearing ? `<button class="btn primary" data-act="log" data-id="${entry.id}">Rate today’s wear</button>` : `<button class="btn primary" data-act="wear" data-id="${r.id}">Wear this today</button>`}
        <button class="btn" data-act="choose">Choose a different one</button>
        ${App.canNotify && App.canNotify() ? `<button class="btn" data-act="send-watch" data-id="${esc(r.id)}">Send to watch</button>` : ''}
        <a class="btn ghost" href="#frag-${esc(r.id)}">Profile</a>
      </div></section>`;
  }

  function scheduleCard() {
    const rec = S.rec; if (!rec) return '';
    const day = rec.day;
    const isTemplate = S.settings.schedule.templateNote && !day.custom && day.occasion === 'day';
    const items = day.blocks.map((b) => {
      const c = b.cond;
      const meta = b.isOutdoor ? `${deg(c.tempF)} feels · ${r0(c.rh)}% RH · dew ${deg(c.dewF)}${c.windMph ? ` · ${r0(c.windMph)} mph wind` : ''}`
        : `~${deg(c.tempF)} (${c.src.temp}) · ${Number.isFinite(c.rh) ? r0(c.rh) + '% RH' : 'RH ?'} (${c.src.rh})${c.hvac && c.hvac !== 'unknown' ? ' · ' + ({ heat: 'heated', ac: 'A/C', vent: 'mild, ventilated', none: 'no HVAC' }[c.hvac] || c.hvac) : ''}`;
      return `<div class="tl"><span class="tl-time">${U.fmtClock(b.start)}</span><span class="tl-dot ${b.isOutdoor ? 'out' : ''}"></span>
        <div class="tl-body"><span class="tl-title">${esc(b.label)} <span class="muted small">· ${esc(b.env.name)}</span></span><span class="tl-meta">${esc(meta)}</span></div></div>`;
    }).join('');
    return `<section class="card"><div class="card-head"><h2>${day.occasion === 'day' ? 'Today’s plan' : esc(day.occasionLabel)}</h2>
      ${day.occasion === 'day' ? `<button class="btn sm" data-act="edit-today">Edit today</button>` : `<button class="btn sm" data-act="occasion" data-v="day">Back to full day</button>`}</div>
      ${isTemplate ? `<div class="notice" style="margin-bottom:10px">This is the starting schedule built from your example day. <a href="#prefs" data-act="goto-sched">Set your real week</a> or <a href="#" data-act="sched-mine">keep it</a>.</div>` : ''}
      ${day.blocks.length ? `<div class="timeline">${items}</div>` : '<p class="dim">Nothing scheduled. Add blocks with “Edit today”.</p>'}
      ${day.transitions.length ? `<p class="muted xs" style="margin-top:8px">${day.transitions.length} environment change${day.transitions.length > 1 ? 's' : ''} flagged · see Weather → Indoor/outdoor model.</p>` : ''}
    </section>`;
  }

  function altCard(kind, r, label, note) {
    if (!r) return '';
    return `<button class="card alt" data-act="alt-open" data-id="${r.id}" data-kind="${kind}">${Ch.bottle(r.frag, 40)}
      <span style="min-width:0"><span class="eyebrow">${esc(label)}</span><span class="alt-name" style="display:block">${esc(r.frag.name)}</span>
      <span class="muted xs">${r.sprays} spray${r.sprays > 1 ? 's' : ''} · ${esc(note)}</span></span><span class="alt-score">${r0(r.final)}</span></button>`;
  }

  function checkinCard() {
    const e = App.todayEntry(); if (!e) return '';
    const opts = (k) => `<select class="input" data-ch="checkin" data-h="${k}" aria-label="Strength at ${L.CHECK_HOURS[k]} hours"><option value="">—</option>${L.LEVEL_WORDS.map((w, i) => `<option value="${i}" ${e.checkins && e.checkins[k] === i ? 'selected' : ''}>${w}</option>`).join('')}</select>`;
    const rated = Number.isFinite(e.enjoyment);
    return `<section class="card"><div class="card-head"><h2>Wearing ${esc(fragName(e.fragranceId))}</h2><span class="muted small">${e.sprays} spray${e.sprays > 1 ? 's' : ''}${e.appliedAt ? ' · applied ' + U.fmtClock(e.appliedAt) : ''}</span></div>
      <p class="dim small" style="margin-bottom:10px">Quick check-ins: how strong does it seem to you (or others) right now?</p>
      <div class="form-grid">${Object.keys(L.CHECK_HOURS).map((k) => `<label class="field">After ${L.CHECK_HOURS[k]}${k === 'h8' ? '+' : ''} h ${opts(k)}</label>`).join('')}</div>
      <div class="actions"><button class="btn ${rated ? '' : 'primary'}" data-act="log" data-id="${e.id}">${rated ? 'Edit rating' : 'Rate this wear'}</button>${rated ? `<span class="row muted small">${stars(e.enjoyment)} ${e.wearAgain ? '· wear again: ' + e.wearAgain : ''}</span>` : ''}</div></section>`;
  }

  V.today = function () {
    const d = S.day;
    const head = `<div class="view-head"><div><div class="eyebrow">${esc(U.fmtDate(d.date, true))}</div><h1>Today</h1></div>${occasionChips()}</div>`;
    const loadErr = S.loadError ? `<div class="notice warn">${esc(S.loadError)}</div>` : '';
    if (!S.frags.length) {
      return `<div class="view">${head}${loadErr}${weatherCard(true)}<section class="card"><div class="empty"><div class="display">Your collection is empty</div>
        <p>Add your five bottles (Liquid Brun, Ralph’s Club New York, Y Iced Cologne, Prada L’Homme, Forever Wanted Elixir) with their published notes, or add your own.</p>
        <div class="actions"><button class="btn primary" data-act="seed">Add my five fragrances</button><a class="btn" href="#add">Add a fragrance</a></div></div></section></div>`;
    }
    if (S.err) return `<div class="view">${head}<div class="notice warn">The recommendation couldn’t be computed: ${esc(S.err.message)}</div></div>`;
    const rec = S.rec;
    const pool = S.frags.filter((f) => !f.excluded && f.remainingPct !== 0);
    const alts = rec && rec.primary ? `<section><div class="row between" style="margin-bottom:10px"><h2 class="display" style="font-size:24px">Alternatives</h2><span class="muted xs">${pool.length < 4 ? 'Add more fragrances for distinct picks' : ''}</span></div>
      <div class="alts">${altCard('overall', rec.alternatives.overall, 'Best overall alternative', 'next-best for your day')}
      ${altCard('subtle', rec.alternatives.subtle, 'Subtle option', 'lower projection')}
      ${altCard('evening', rec.alternatives.evening, 'Evening / special occasion', 'scored for tonight')}</div></section>` : '';
    return `<div class="view">${head}${loadErr}${weatherCard(true)}${sotdCard()}${checkinCard()}
      <div class="grid-2" style="align-items:start">${scheduleCard()}<div class="stack">${alts}</div></div></div>`;
  };

  // ======================= COLLECTION =======================
  V.collection = function () {
    const q = S.ui.search.trim().toLowerCase();
    const fams = [...new Set(S.frags.filter((f) => f.owned !== false).map((f) => f.families && f.families.primary).filter(Boolean))];
    const stats = L.wearStats(S.frags, S.journal, S.day.date);
    const notOwned = S.frags.filter((f) => f.owned === false);
    let list = S.frags.filter((f) => f.owned !== false && (S.ui.filter === 'all' || (f.families && (f.families.primary === S.ui.filter || f.families.secondary === S.ui.filter)))
      && (!q || [f.name, f.brand, ...(f.notes ? [...f.notes.top, ...f.notes.heart, ...f.notes.base] : [])].join(' ').toLowerCase().includes(q)));
    const sc = (f) => { const r = App.resultFor(f.id); return r ? r.final : -1; };
    const sorts = { score: (a, b) => sc(b) - sc(a), name: (a, b) => a.name.localeCompare(b.name), worn: (a, b) => (stats[b.id].count - stats[a.id].count), recent: (a, b) => (b.createdAt || '').localeCompare(a.createdAt || '') };
    list = list.sort(sorts[S.ui.sort] || sorts.score);
    const cards = list.map((f) => {
      const r = App.resultFor(f.id), st = stats[f.id];
      const rem = Number.isFinite(f.remainingPct) ? `<div class="remain"><span class="bar-track"><span class="bar-fill" style="width:${f.remainingPct}%"></span></span><span>${f.remainingPct}% left</span></div>` : '';
      return `<button class="card fcard" data-act="frag-open" data-id="${esc(f.id)}">${Ch.bottle(f, 54)}<div class="stack" style="gap:5px;min-width:0">
        <div class="fname">${esc(f.name)}</div><div class="fmeta">${esc(f.brand)} · ${esc(f.concentration || '—')}</div>
        <div class="row" style="gap:6px">${f.families && f.families.primary ? `<span class="tag">${esc(f.families.primary)}</span>` : ''}${r ? `<span class="tag">Today ${r0(r.final)}</span>` : f.excluded || f.remainingPct === 0 ? '<span class="tag">Not in rotation</span>' : ''}</div>
        <div class="muted xs">${st.count ? `Worn ${st.count}× · last ${U.fmtDate(st.last)}` : 'Not logged yet'}</div>${rem}</div></button>`;
    }).join('');
    const nOwned = S.frags.length - notOwned.length;
    return `<div class="view"><div class="view-head"><div><div class="eyebrow">${nOwned} fragrance${nOwned === 1 ? '' : 's'}</div><h1>My Collection</h1></div>
      <a class="btn primary" href="#add">${icon('plus')} Add fragrance</a></div>
      <div class="row"><input class="input" style="flex:1;min-width:180px" type="search" id="coll-search" placeholder="Search name, brand or note" value="${esc(S.ui.search)}" data-ch="search" data-live>
        <select class="input" style="width:auto" id="coll-sort" data-ch="sort" aria-label="Sort"><option value="score" ${S.ui.sort === 'score' ? 'selected' : ''}>Today’s score</option><option value="name" ${S.ui.sort === 'name' ? 'selected' : ''}>Name</option><option value="worn" ${S.ui.sort === 'worn' ? 'selected' : ''}>Most worn</option><option value="recent" ${S.ui.sort === 'recent' ? 'selected' : ''}>Recently added</option></select></div>
      <div class="chips scroll"><button class="chip" data-act="filter" data-v="all" aria-pressed="${S.ui.filter === 'all'}">All</button>${fams.map((f) => `<button class="chip" data-act="filter" data-v="${esc(f)}" aria-pressed="${S.ui.filter === f}">${esc(f)}</button>`).join('')}</div>
      ${notOwned.length ? `<p class="muted small">${notOwned.length} profile${notOwned.length > 1 ? 's' : ''} you don’t own (${esc(notOwned.map((f) => f.name).join(', '))}) live in <a href="#discover-wishlist">Discover → Wishlist</a>.</p>` : ''}
      ${list.length ? `<div class="coll-grid">${cards}<a class="card fcard add" href="#add">${icon('plus')} Add a fragrance</a></div>` : S.frags.length ? '<p class="dim">No fragrances match.</p>' : `<div class="card empty"><div class="display">Nothing here yet</div><div class="actions"><button class="btn primary" data-act="seed">Add my five fragrances</button><a class="btn" href="#add">Add your own</a></div></div>`}
    </div>`;
  };

  V.frag = function () {
    const f = App.fragById(S.param);
    if (!f) return `<div class="view"><div class="card"><h2>Fragrance not found</h2><div class="actions"><a class="btn" href="#collection">Back to collection</a></div></div></div>`;
    const r = App.resultFor(f.id);
    const mine = L.personalPerf(f.id, S.journal);
    const entries = S.journal.filter((e) => e.fragranceId === f.id);
    const enjoy = entries.map((e) => e.enjoyment).filter(Number.isFinite);
    const pats = L.patterns(S.frags, S.journal, S.settings.prefs).filter((p) => p.fragId === f.id);
    const an = FPI.Content.ANALYSIS[f.id];
    const t = f.traits || {}, p = f.perf || {}, u = f.usage || {};
    const tier = (k, lbl) => `<div class="tier"><span class="k">${lbl}</span><span class="v">${(f.notes && f.notes[k] || []).map(esc).join(', ') || '—'}</span></div>`;
    const ps = f.perfSource || {}, ns = f.notesSource || {}, ts = f.traitsSource || { type: 'estimate', text: 'Estimated from the composition.' }, us = f.usageSource || { type: 'estimate' };
    return `<div class="view">
      <div class="row"><a class="btn sm ghost" href="#collection">${icon('back')} Collection</a></div>
      <section class="card"><div class="detail-hero">${Ch.bottle(f, 96)}<div class="stack" style="gap:6px;min-width:0">
        <div class="eyebrow">${esc(f.house || f.brand)}${f.year ? ' · ' + f.year : ''}</div><h1>${esc(f.name)}</h1>
        <p class="dim">${esc(f.brand)} · ${esc(f.concentration || 'Concentration not set')}${f.perfumer ? ' · perfumer ' + esc(f.perfumer) : ''}</p>
        ${f.inspiredBy ? `<p class="muted small">Inspired by ${esc(f.inspiredBy)}</p>` : ''}
        <div class="row">${f.families && f.families.primary ? `<span class="tag">${esc(f.families.primary)}</span>` : ''}${f.families && f.families.secondary ? `<span class="tag">${esc(f.families.secondary)}</span>` : ''}${(f.usage && f.usage.seasons || []).map((s) => `<span class="tag">${esc(s)}</span>`).join('')}</div>
        <div class="actions" style="margin-top:6px"><button class="btn primary" data-act="wear" data-id="${esc(f.id)}">Wear today</button><a class="btn" href="#edit-${esc(f.id)}">Edit</a><button class="btn danger" data-act="frag-delete" data-id="${esc(f.id)}">Remove</button></div>
      </div></div></section>
      ${r ? `<section class="card"><div class="card-head"><h2>Today’s fit</h2><span class="alt-score">${r0(r.final)}</span></div>
        <p class="dim small" style="margin-bottom:10px">${r.sprays} spray${r.sprays > 1 ? 's' : ''} · ${r.application.spots.map(esc).join(', ')} · ~${U.round(r.longevity.lo, 0)}–${U.round(r.longevity.hi, 0)} h</p>
        ${factorRows(r, S.rec.weights)}<div style="margin-top:14px">${Ch.dayChart(r, S.rec.day)}</div></section>` : ''}
      <div class="grid-2" style="align-items:start">
        <section class="card"><div class="card-head"><h2>Notes</h2>${srcTag(ns.type, ns.text)}</div><div class="pyramid">${tier('top', 'Top')}${tier('heart', 'Heart')}${tier('base', 'Base')}</div>
          ${ns.text ? `<p class="muted xs" style="margin-top:12px">${esc(ns.text)}</p>` : ''}</section>
        <section class="card"><div class="card-head"><h2>Olfactory profile</h2>${srcTag(ts.type, ts.text)}</div>
          ${Ch.bars(C.TRAIT_KEYS.map(([k, l]) => ({ label: l, value: Number(t[k]) || 0, display: `${t[k] ?? '—'}/10` })), { max: 10 })}
          <p class="muted xs" style="margin-top:10px">${esc(ts.text || 'Estimated from the composition.')}</p></section>
      </div>
      <div class="grid-2" style="align-items:start">
        <section class="card"><div class="card-head"><h2>Performance</h2>${srcTag(ps.type, ps.text)}</div>
          <table><thead><tr><th></th><th class="num">Published / estimate</th><th class="num">Yours</th></tr></thead><tbody>

  function compatMatrix() {
    const rec = S.rec; if (!rec || !rec.results.length) return '';
    const blocks = rec.day.blocks.filter((b) => b.act.relevance >= 0.9 || b.isOutdoor);
    if (!blocks.length) return '';
    const cell = (r, b) => {
      const w = r.factors.weather.details.find((d) => d.label === b.label);
      const h = r.factors.humidity.details.find((d) => d.label === b.label);
      const t = Object.assign({ sweetness: 5, freshness: 5, warmth: 5, spice: 5, creamy: 5, citrus: 5, amber: 5, density: 5 }, r.frag.traits);
      const c = E.compBlock(t, b.cond.tempF, b.cond.dewF, b.cond.rh).v;
      const sp = r.spaceRows.find((x) => x.id === b.id);
      const s = sp ? U.clamp(100 - 12 * sp.over * sp.others - 6 * sp.under, 0, 100) : 100;
      const v = U.avg([w ? w.v : NaN, h ? h.v : NaN, c, s].filter(Number.isFinite));
      const bg = v >= 80 ? 'color-mix(in srgb, var(--good) 28%, transparent)' : v >= 65 ? 'color-mix(in srgb, var(--warn) 24%, transparent)' : 'color-mix(in srgb, var(--bad) 28%, transparent)';
      return `<td><span class="cell" style="background:${bg}" data-tip="${esc(r.frag.name)} in ${esc(b.label)}: weather ${r0(w && w.v)}, humidity ${r0(h && h.v)}, composition ${r0(c)}, space ${r0(s)}">${r0(v)}</span></td>`;
    };
    return `<section class="card"><div class="card-head"><h2>Environmental compatibility</h2><span class="muted xs">Each space today, per fragrance (0–100)</span></div>
      <div class="table-wrap"><table><thead><tr><th>Fragrance</th>${blocks.map((b) => `<th>${esc(b.label)}<br><span class="muted">${U.fmtClock(b.start)}</span></th>`).join('')}</tr></thead>

  }

        <div class="table-wrap"><table><thead><tr><th>When</th><th>Where</th><th class="num">Temp</th><th class="num">Humidity</th><th>Air</th><th class="num">Room comfort</th></tr></thead><tbody>${envRows}</tbody></table></div>

  V.journal = function () {
    const flt = S.ui.jFilter;
    const list = S.journal.filter((e) => flt === 'all' || e.fragranceId === flt);
    const groups = {};
    list.forEach((e) => { const k = e.date.slice(0, 7); (groups[k] = groups[k] || []).push(e); });
    const row = (e) => {
      const l = L.longevityOf(e); const d = U.parseDateKey(e.date);
      const c = e.cond || {};
      return `<button class="entry" data-act="log" data-id="${esc(e.id)}"><span class="entry-date"><b>${d.getDate()}</b>${U.DOW[d.getDay()]}</span>
        <span style="min-width:0"><span style="display:block;font-family:var(--f-display);font-size:18px">${esc(fragName(e.fragranceId))}</span>
        <span class="muted xs">${e.sprays ? e.sprays + ' spray' + (e.sprays > 1 ? 's' : '') + ' · ' : ''}${c.outMeanF != null ? deg(c.outMeanF) + 'F' : ''}${c.dewF != null ? ' · dew ' + deg(c.dewF) : ''}${l ? ' · ~' + U.round(l.hours, 1) + ' h' : ''}${e.strength ? ' · ' + { faint: 'too faint', right: 'just right', strong: 'too strong' }[e.strength] : ''}${e.tooSweet ? ' · too sweet' : ''}</span></span>
        <span class="stack" style="gap:2px;justify-items:end">${Number.isFinite(e.enjoyment) ? stars(e.enjoyment) : '<span class="tag">Rate</span>'}${e.wearAgain ? `<span class="muted xs">again: ${e.wearAgain}</span>` : ''}</span></button>`;
    };
    const today = App.todayEntry();
    return `<div class="view"><div class="view-head"><div><div class="eyebrow">${S.journal.length} entr${S.journal.length === 1 ? 'y' : 'ies'}</div><h1>Fragrance Journal</h1></div>
      <button class="btn primary" data-act="log">${icon('plus')} Log a wear</button></div>
      <div class="notice small">Logging takes about 15 seconds: fragrance, sprays, a star rating and “would you wear it again”. Today’s weather and schedule are captured automatically. Check-ins and details are optional.</div>
      ${today && !Number.isFinite(today.enjoyment) ? `<section class="card row between"><span>You’re wearing <b>${esc(fragName(today.fragranceId))}</b> today.</span><button class="btn sm primary" data-act="log" data-id="${today.id}">Rate it</button></section>` : ''}
      ${S.frags.length ? `<div class="chips scroll"><button class="chip" data-act="jfilter" data-v="all" aria-pressed="${flt === 'all'}">All</button>${S.frags.map((f) => `<button class="chip" data-act="jfilter" data-v="${esc(f.id)}" aria-pressed="${flt === f.id}">${esc(f.name)}</button>`).join('')}</div>` : ''}
      ${list.length ? Object.entries(groups).map(([k, es]) => { const [y, m] = k.split('-'); return `<section class="card"><div class="card-head"><h2>${U.MONTHS[Number(m) - 1]} ${y}</h2><span class="muted xs">${es.length} wear${es.length > 1 ? 's' : ''}</span></div>${es.map(row).join('')}</section>`; }).join('')
        : `<section class="card empty"><div class="display">No entries yet</div><p>Each wear you log teaches the engine how your fragrances behave on your skin, in your spaces, in your weather.</p><button class="btn primary" data-act="log">Log your first wear</button></section>`}
    </div>`;
  };

  // ======================= INSIGHTS =======================
  V.insights = function () {
    const frags = S.frags.filter((f) => f.owned !== false), J = S.journal, prefs = S.settings.prefs;
    const stats = L.wearStats(frags, J, S.day.date);
    const priced = frags.filter((f) => Number.isFinite(f.pricePaid));
    const longs = J.map(L.longevityOf).filter(Boolean).map((l) => l.hours);
    const projs = J.map(L.openingProjection).filter(Number.isFinite);
    const color = (id) => Ch.colorFor(App.colorIndex(id));
    const tile = (k, v, sub) => `<div class="card"><div class="fact"><span class="k">${k}</span><span class="display" style="font-size:34px;line-height:1.1">${v}</span><span class="muted xs">${sub}</span></div></div>`;
    const tiles = `<div class="grid-3" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      ${tile('Fragrances', frags.length, `${frags.filter((f) => !f.excluded && f.remainingPct !== 0).length} in rotation`)}
      ${tile('Collection value', priced.length ? '$' + Math.round(priced.reduce((s, f) => s + f.pricePaid, 0)) : '—', priced.length === frags.length ? 'from prices you entered' : `${frags.length - priced.length} without a price`)}
      ${tile('Wears logged', J.length, J.length ? `since ${U.fmtDate(J[J.length - 1].date)}` : 'start in Journal')}
      ${tile('Avg longevity', longs.length ? U.round(U.avg(longs), 1) + ' h' : '—', longs.length ? `your logs, n=${longs.length}` : 'needs check-ins')}
      ${tile('Avg projection', projs.length ? U.round(U.avg(projs), 1) + '/10' : '—', projs.length ? `your logs, n=${projs.length}` : 'needs ratings')}</div>`;

    const qs = L.questions(frags, J, prefs);
    const qa = `<section class="card"><div class="card-head"><h2>Ask your data</h2>${srcTag('mine')}</div><div class="stack">${qs.map((q) => `<div class="stack" style="gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)"><span class="small">${esc(q.title)}</span>
      ${q.answer ? `<span class="display" style="font-size:19px">${esc(q.answer)}</span>${q.rows.length > 1 ? `<span class="muted xs">${q.rows.slice(1, 4).map((r) => `${esc(r.name)} (${r.n})`).join(' · ')}</span>` : ''}` : `<span class="muted small">${esc(q.need)}</span>`}</div>`).join('')}</div></section>`;
    const pats = L.patterns(frags, J, prefs);
    const patCard = `<section class="card"><div class="card-head"><h2>Patterns in your wears</h2>${srcTag('mine')}</div>${pats.length ? `<ul class="issues">${pats.map((p) => `<li>${esc(p.text)} <span class="muted">${p.confidence} · ${esc(p.detail)}</span></li>`).join('')}</ul>`
      : `<p class="dim small">No patterns yet. They appear once a fragrance has about 4 rated wears with a spread of conditions, and single observations never count as a pattern.</p>`}</section>`;

    // Usage
    const wornRows = frags.map((f) => ({ label: f.name, value: stats[f.id].count, display: String(stats[f.id].count), color: color(f.id) })).sort((a, b) => b.value - a.value);
    const weeks = [];
    for (let i = 11; i >= 0; i--) {
      const start = U.addDays(S.day.date, -7 * i - 6), end = U.addDays(S.day.date, -7 * i);
      const n = J.filter((e) => e.date >= start && e.date <= end).length;
      weeks.push({ label: `Week of ${U.fmtDate(start)}`, short: U.fmtDate(start).replace(' ', ' '), value: n });
    }
    const usage = `<section class="card"><div class="card-head"><h2>Usage</h2></div>${J.length ? `${U.wavg ? '' : ''}<span class="eyebrow">Most to least worn</span>${Ch.bars(wornRows)}
      <div style="margin-top:16px"><span class="eyebrow">Wears per week</span>${Ch.columnChart(weeks, { every: 2, aria: 'Wears per week, last 12 weeks' })}</div>` : '<p class="dim small">Log wears to see usage.</p>'}</section>`;

    // Trends + correlation
    const rated = J.filter((e) => Number.isFinite(e.enjoyment) || e.wearAgain);
    const byF = {};
    rated.forEach((e) => { const o = L.outcome(e, prefs); if (o == null) return; (byF[e.fragranceId] = byF[e.fragranceId] || []).push({ x: U.parseDateKey(e.date).getTime(), y: o, tip: `${fragName(e.fragranceId)} · ${U.fmtDate(e.date)} · ${Math.round(o)}/100` }); });
    const series = Object.entries(byF).map(([id, pts]) => ({ name: fragName(id), color: color(id), points: pts }));
    const allX = series.flatMap((s) => s.points.map((p) => p.x));
    const xLabels = allX.length ? [Math.min(...allX), Math.max(...allX)].map((x) => ({ x, text: U.fmtDate(U.dateKey(new Date(x))) })) : [];
    const trend = `<section class="card"><div class="card-head"><h2>How your wears have gone</h2><span class="muted xs">Outcome 0–100 from your ratings</span></div>${series.length ? Ch.lineChart(series, { yMin: 0, yMax: 100, yTicks: [0, 50, 100], xLabels, aria: 'Wear outcomes over time' }) : '<p class="dim small">Rate a few wears to see the trend.</p>'}</section>`;
    const pts = rated.filter((e) => e.cond && e.cond.outMeanF != null).map((e) => ({ x: e.cond.outMeanF, y: L.outcome(e, prefs), color: color(e.fragranceId), tip: `${fragName(e.fragranceId)} · ${deg(e.cond.outMeanF)}F, dew ${deg(e.cond.dewF)}F · ${Math.round(L.outcome(e, prefs))}/100` })).filter((p) => p.y != null);
    const corr = `<section class="card"><div class="card-head"><h2>Weather vs. outcome</h2><span class="muted xs">Outdoor temperature (x) · outcome (y)</span></div>${pts.length ? Ch.scatter(pts, { xUnit: '°', xLabel: 'Outdoor °F', aria: 'Outcome by outdoor temperature' }) + `<div class="legend">${frags.map((f) => `<span><i class="sw" style="background:${color(f.id)}"></i>${esc(f.name)}</span>`).join('')}</div>` : '<p class="dim small">Appears once rated wears have weather attached.</p>'}</section>`;

    // Best performers: personal when available, otherwise estimated and labeled
    const bucket = (pred) => {
      const rows = frags.map((f) => { const es = rated.filter((e) => e.fragranceId === f.id && e.cond && pred(e.cond)); const os = es.map((e) => L.outcome(e, prefs)).filter((v) => v != null); return os.length >= 2 ? { f, v: U.avg(os), n: os.length } : null; }).filter(Boolean).sort((a, b) => b.v - a.v);
      return rows;
    };
    const est = (fn) => frags.slice().sort((a, b) => fn(b) - fn(a))[0];
    const perfRow = (title, rows, estPick, estWhy) => `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="small">${title}</span>
      ${rows.length ? `<span class="row"><b>${esc(rows[0].f.name)}</b><span class="muted xs">avg ${Math.round(rows[0].v)} · n=${rows[0].n}</span>${srcTag('mine')}</span>` : estPick ? `<span class="row"><span class="dim">${esc(estPick.name)}</span><span class="muted xs">${estWhy}</span>${srcTag('estimate', 'From estimated profiles, not your logs')}</span>` : '<span class="muted">—</span>'}</div>`;
    const best = `<section class="card"><div class="card-head"><h2>Best performers by condition</h2></div>
      ${perfRow('High humidity (dew pt 60°F+)', bucket((c) => c.dewF != null && c.dewF >= 60), est((f) => (f.usage.dewMax || 0)), 'highest dew tolerance')}
      ${perfRow('Low humidity (dew pt under 40°F)', bucket((c) => c.dewF != null && c.dewF < 40), est((f) => (f.traits.density || 0)), 'densest base')}
      ${perfRow('Hot weather (75°F+)', bucket((c) => c.outMeanF != null && c.outMeanF >= 75), est((f) => (f.usage.tempHi || 0)), 'highest comfort ceiling')}
      ${perfRow('Cold weather (under 45°F)', bucket((c) => c.outMeanF != null && c.outMeanF < 45), est((f) => (f.traits.warmth || 0) + (f.traits.density || 0) * 0.5), 'warmest structure')}
      <p class="muted xs" style="margin-top:8px">Rows switch from estimates to your data once a fragrance has 2+ rated wears in that condition.</p></section>`;

    // Distribution + versatility
    const famCount = {}; frags.forEach((f) => { const k = (f.families && f.families.primary) || 'Unset'; famCount[k] = (famCount[k] || 0) + 1; });
    const seaCount = { spring: 0, summer: 0, fall: 0, winter: 0 }; frags.forEach((f) => (f.usage.seasons || []).forEach((s) => { if (s in seaCount) seaCount[s]++; }));
    const vers = frags.map((f) => { const rs = Object.values(f.usage.ratings || {}).map(Number); const breadth = U.avg(rs) * 10; const range = (f.usage.tempHi - f.usage.tempLo); return { f, v: 0.6 * breadth + 0.4 * U.clamp(range * 1.6, 0, 100) }; }).sort((a, b) => b.v - a.v);
    const dist = `<section class="card"><div class="card-head"><h2>Collection makeup</h2>${srcTag('estimate', 'Seasons and versatility come from the profiles')}</div>
      <span class="eyebrow">Families</span>${Ch.bars(Object.entries(famCount).map(([k, v]) => ({ label: k, value: v, display: String(v) })))}
      <div style="margin-top:14px"><span class="eyebrow">Seasons covered</span>${Ch.bars(Object.entries(seaCount).map(([k, v]) => ({ label: k[0].toUpperCase() + k.slice(1), value: v, display: String(v) })), { max: Math.max(1, frags.length) })}</div>
      <div style="margin-top:14px"><span class="eyebrow">Most versatile (estimated)</span>${Ch.bars(vers.map((x) => ({ label: x.f.name, value: x.v, display: String(Math.round(x.v)) })), { max: 100 })}</div></section>`;

    // Compare
    const cmpIds = S.ui.compare.filter((id) => App.fragById(id));
    const cmpSel = cmpIds.length >= 2 ? cmpIds : frags.slice(0, Math.min(3, frags.length)).map((f) => f.id);
    const cmpFr = cmpSel.map(App.fragById).filter(Boolean);
    const compare = `<section class="card"><div class="card-head"><h2>Compare</h2><span class="muted xs">Pick 2–4</span></div>
      <div class="chips" style="margin-bottom:12px">${frags.map((f) => `<button class="chip" data-act="compare" data-id="${esc(f.id)}" aria-pressed="${cmpSel.includes(f.id)}">${esc(f.name)}</button>`).join('')}</div>
      ${cmpFr.length >= 2 ? `${Ch.radar(C.TRAIT_KEYS, cmpFr.map((f) => ({ name: f.name, color: color(f.id), values: f.traits })))}
      <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th></th>${cmpFr.map((f) => `<th class="num">${esc(f.name)}</th>`).join('')}</tr></thead><tbody>
        ${[['Today’s score', (f) => { const r = App.resultFor(f.id); return r ? r0(r.final) : '—'; }], ['Sprays today', (f) => { const r = App.resultFor(f.id); return r ? r.sprays : '—'; }], ['Longevity est.', (f) => `~${f.perf.longevityH} h`],
          ['Your longevity', (f) => { const m = L.personalPerf(f.id, J); return m.nLong ? U.round(m.longevityH, 1) + ' h' : '—'; }], ['Opening projection', (f) => `${f.perf.projOpen}/10`], ['Comfort temps', (f) => `${f.usage.tempLo}–${f.usage.tempHi}°F`],
          ['Max dew point', (f) => `${f.usage.dewMax}°F`], ['Wears', (f) => stats[f.id].count], ['Avg enjoyment', (f) => { const v = J.filter((e) => e.fragranceId === f.id).map((e) => e.enjoyment).filter(Number.isFinite); return v.length ? U.round(U.avg(v), 1) : '—'; }]]
          .map(([k, fn]) => `<tr><td>${k}</td>${cmpFr.map((f) => `<td class="num">${fn(f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '<p class="dim small">Add at least two fragrances to compare.</p>'}</section>`;

    const ad = S.rec ? S.rec.adaptive : null;
    const weights = ad ? `<section class="card"><div class="card-head"><h2>Scoring weights</h2><span class="muted xs">${ad.active ? `Adapted from ${ad.n} rated wears` : `Starting weights · adapts after ${L.MIN_ADAPT} rated wears (${ad.n} so far)`}</span></div>
      <div class="table-wrap"><table><thead><tr><th>Factor</th><th class="num">Your setting</th><th class="num">In use</th><th class="num">Link to enjoyment</th></tr></thead><tbody>
      ${Object.keys(C.DEFAULT_WEIGHTS).map((k) => `<tr><td>${C.FACTOR_LABELS[k]}</td><td class="num">${Math.round(ad.details[k].base)}%</td><td class="num">${Math.round(ad.details[k].adapted)}%</td><td class="num">${ad.details[k].r == null ? '—' : ad.details[k].r}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted xs" style="margin-top:8px">When adapting, each factor’s weight moves up to ±36% based on how well it tracked your enjoyment ratings, and “Your history” gains weight as logs accumulate.</p></section>` : '';

    return `<div class="view"><div class="view-head"><div><div class="eyebrow">From your collection and journal</div><h1>Insights</h1></div></div>
      ${tiles}<div class="grid-2" style="align-items:start">${qa}${patCard}</div>${trend}<div class="grid-2" style="align-items:start">${usage}${corr}</div>
      <div class="grid-2" style="align-items:start">${best}${dist}</div>${compare}${weights}</div>`;
  };

  // ======================= LEARN =======================
  V.learn = function () {
    const A = FPI.Content.ARTICLES, AN = FPI.Content.ANALYSIS;
    const art = A.map((a, i) => `<details class="article" ${i === 0 ? 'open' : ''}><summary><h3>${esc(a.title)}</h3><span class="tag">${esc(a.tag)}</span></summary><div class="article-body">${a.body.map((p) => `<p>${esc(p)}</p>`).join('')}</div></details>`).join('');
    const mine = S.frags.filter((f) => f.owned !== false).map((f) => {
      const an = AN[f.id];
      const t = f.traits || {};
      const heavy = Math.round((0.5 * t.sweetness + 0.3 * t.density + 0.2 * t.amber) * 10) / 10;
      return `<details class="article"><summary><h3>${esc(f.name)}</h3><span class="muted xs">${esc(f.brand)}</span></summary><div class="article-body">
        ${an ? `<p><b class="eyebrow">Structure</b><br>${esc(an.structure)}</p><p><b class="eyebrow">Behavior</b><br>${esc(an.behavior)}</p><p><b class="eyebrow">Watch</b><br>${esc(an.watch)}</p>` : `<p>Notes: ${esc([...(f.notes.top || []), ...(f.notes.heart || []), ...(f.notes.base || [])].join(', ') || 'not entered')}.</p>`}
        <p class="small">Heaviness index ${heavy}/10 (sweetness × density × amber) · comfort ~${f.usage.tempLo}–${f.usage.tempHi}°F · dew point limit ~${f.usage.dewMax}°F. These drive its heat and humidity scoring.</p>
        <a class="btn sm" href="#frag-${esc(f.id)}">Open profile</a></div></details>`;
    }).join('');
    return `<div class="view"><div class="view-head"><div><div class="eyebrow">How fragrance behaves</div><h1>Learn</h1></div></div>
      <p class="dim" style="max-width:68ch">Physics is stated as physics; what wearers commonly report is labeled that way. Where the app relies on an assumption, it says so, and your journal is how those assumptions get tested.</p>
      <div class="stack">${art}</div>
      ${S.frags.length ? `<h2 class="display" style="font-size:26px;margin-top:8px">Your collection, analyzed</h2><div class="stack">${mine}</div>` : ''}</div>`;
  };

  // ======================= SETTINGS =======================
  V.prefs = function () {
    const st = S.settings, p = st.prefs;
    const rng = (key, label, min, max, step = 1) => `<label class="range-row"><span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${p[key]}" data-ch="pref" data-k="${key}" data-live id="pref-${key}"><output class="mono">${p[key]}</output></label>`;
    const prefsCard = `<section class="card stack" id="sec-prefs"><div class="card-head"><h2>Preferences</h2><span class="muted xs">Starting points, not rules</span></div>
      <div class="form-grid wide"><label class="field">Overall profile<select class="input" data-ch="pref" data-k="profile" id="pref-profile">${['Balanced', 'Fresh-leaning', 'Warm-leaning', 'Sweet-leaning', 'Bold'].map((x) => `<option ${p.profile === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
      <div class="stack" style="gap:6px">${rng('sweetness', 'Sweetness', 1, 10)}${rng('freshness', 'Freshness', 1, 10)}${rng('warmth', 'Warmth', 1, 10)}${rng('spice', 'Spice', 1, 10)}
        ${rng('projection', 'Projection target', 1, 10)}${rng('intensity', 'Intensity', 1, 10)}${rng('longevityImportance', 'Longevity matters', 0, 10)}${rng('sensitivity', 'Scent sensitivity', 1, 10)}
        ${rng('minSprays', 'Fewest sprays', 1, 5)}${rng('maxSprays', 'Most sprays', 1, 10)}</div>
      <div class="form-grid wide">
        <label class="field">Notes/qualities you like<input class="input" data-ch="pref-list" data-k="likes" id="pref-likes" value="${esc(p.likes.join(', '))}"></label>
        <label class="field">Characteristics you dislike<input class="input" data-ch="pref-list" data-k="dislikes" id="pref-dislikes" value="${esc(p.dislikes.join(', '))}"></label>
        <label class="field">Preferred families<input class="input" data-ch="pref-list" data-k="likedFamilies" id="pref-lf" value="${esc(p.likedFamilies.join(', '))}"></label>
        <label class="field">Families to avoid<input class="input" data-ch="pref-list" data-k="dislikedFamilies" id="pref-df" value="${esc(p.dislikedFamilies.join(', '))}"></label>
        <label class="field">Preferred occasions<input class="input" data-ch="pref-list" data-k="occasions" id="pref-occ" value="${esc(p.occasions.join(', '))}"></label></div>
      <p class="muted xs">Likes and dislikes match fragrance tags (e.g. vanilla, warm, fresh, loud, polarizing).</p>
      <label class="switch"><span>I usually moisturize before spraying</span><input type="checkbox" data-ch="pref-bool" data-k="moisturize" id="pref-moist" ${p.moisturize ? 'checked' : ''}></label>
      <label class="switch"><span>Let compliments count in learning<br><span class="muted xs">Off by default: you said enjoyment matters more than compliments.</span></span><input type="checkbox" data-ch="pref-bool" data-k="countCompliments" id="pref-comp" ${p.countCompliments ? 'checked' : ''}></label>
      <label class="field">Notes to self<textarea class="input" data-ch="pref" data-k="notes" id="pref-notes">${esc(p.notes || '')}</textarea></label></section>`;

    const loc = st.location;
    const locCard = `<section class="card stack" id="sec-loc"><div class="card-head"><h2>Location</h2></div>
      <div class="row between"><span>${icon('pin', 'inline-ic')} <b>${esc(loc.name)}</b> <span class="muted mono xs">${loc.lat.toFixed(3)}, ${loc.lon.toFixed(3)}</span></span><button class="btn sm" data-act="loc-open">Change</button></div>
      ${G.claude ? '<p class="muted xs">Device location isn’t available inside Claude’s viewer; set it by name or coordinates. The installed app uses GPS.</p>'
        : `<label class="switch"><span>Use my phone’s location automatically<br><span class="muted xs">${S.geo.status === 'denied' ? 'Location permission is off for Sillage.' : S.geo.at ? 'Last fix ' + new Date(S.geo.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'Checks when you open the app'}</span></span><input type="checkbox" data-ch="loc-auto" id="loc-auto" ${loc.auto !== false ? 'checked' : ''}></label>`}</section>`;

    // Schedule
    const dsel = S.ui.schedDay == null ? (U.parseDateKey(S.day.date).getDay()) : S.ui.schedDay;
    const blocks = st.schedule.week[dsel] || [];
    const envOpts = (cur) => st.envs.map((e) => `<option value="${esc(e.id)}" ${cur === e.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('');
    const actOpts = (cur) => Object.entries(C.ACTIVITIES).map(([k, a]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${esc(a.label)}</option>`).join('');
