  // ---------- GPS ----------
  App.autoLocate = function (force) {
    if (!hosted || !navigator.geolocation || S.settings.location.auto === false) return Promise.resolve();
    if (!force && S.geo.at && Date.now() - S.geo.at < 3 * 3600 * 1000) return Promise.resolve();
    S.geo.status = 'locating';
    return new Promise((res) => {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude, cur = S.settings.location;
        S.geo = { status: 'ok', at: Date.now() };
        const moved = FPI.Climate.km(lat, lon, cur.lat, cur.lon) > 3 || cur.mode !== 'gps';
        if (moved) {
          const name = (await W.reverseGeocode(lat, lon)) || cur.name || 'Current location';
          S.settings.location = { name, lat: U.round(lat, 4), lon: U.round(lon, 4), mode: 'gps', auto: true };
          App.saveSettings(); S.day.weather = null; await App.refreshWeather(true);
        } else App.render();
        res();
      }, (err) => { S.geo = { status: err.code === 1 ? 'denied' : 'error', at: null }; App.render(); res(); }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 30 * 60 * 1000 });
    });
  };

  // ---------- Notifications ----------
  const iconUrl = 'icon-192.png', badgeUrl = 'badge-96.png';
  async function show(title, opts) { if (!App.canNotify()) return false; await reg.showNotification(title, Object.assign({ icon: iconUrl, badge: badgeUrl, lang: 'en' }, opts)); return true; }
  App.notifyPick = async function (r) {
    if (!r) return false;
    const w = S.day.weather && S.day.weather.current;
    const body = `${r.sprays} spray${r.sprays > 1 ? 's' : ''} · ${r.application.spots.slice(0, 2).join(', ').toLowerCase()} · ~${Math.round(r.longevity.lo)}–${Math.round(r.longevity.hi)} h${w ? ` · ${Math.round(w.tempF)}°F, dew ${Math.round(w.dewF)}°` : ''}`;
    return show(`Scent of the day: ${r.frag.name}`, { body, tag: 'sotd', renotify: true, data: { type: 'sotd', fragId: r.id, name: r.frag.name, date: S.day.date, sprays: r.sprays },
      actions: [{ action: 'wear', title: 'Wear it' }, { action: 'open', title: 'See options' }] });
  };
  App.notifyWearing = async function (e, f) {
    if (!App.canNotify() || S.settings.notify.wearing === false) return;
    await show(`Wearing ${f.name}`, { body: 'How strong does it seem right now? Tap any time; it’s logged against the hour.', tag: 'wearing', silent: true, renotify: false,
      data: { type: 'wearing', date: e.date, entryId: e.id, name: f.name }, actions: [{ action: 'strong', title: 'Still noticeable' }, { action: 'faint', title: 'Faint / gone' }] });
  };
  A['send-watch'] = async () => {
    const r = S.day.choice && S.day.choice.fragId ? App.resultFor(S.day.choice.fragId) : S.rec && S.rec.primary;
    const ok = await App.notifyPick(r); App.toast(ok ? 'Sent. It shows on your watch through phone notifications.' : 'Turn on notifications in Settings → Phone & watch first.');
  };

  // Messages queued by notification buttons (tapped on the phone or the watch)
  let inboxBusy = false;
  App.processInbox = async function () {
    if (inboxBusy || !S.ready) return; inboxBusy = true;
    try {
      const items = await App.store().takeInbox();
      for (const it of items) {
        if (it.date !== S.day.date) continue;
        if (it.type === 'wear' && App.fragById(it.fragId)) { await A.wear({ dataset: { id: it.fragId }, fromInbox: true }); }
        if (it.type === 'checkin') {
          const e = App.todayEntry(); if (!e) continue;
          const [h, m] = (e.appliedAt || '07:00').split(':').map(Number);
          const applied = U.parseDateKey(e.date); applied.setHours(h, m || 0, 0, 0);
          const hrs = (it.at - applied.getTime()) / 3600000;
          const key = hrs < 2 ? 'h1' : hrs < 4.5 ? 'h3' : hrs < 7 ? 'h6' : 'h8';
          e.checkins = Object.assign({}, e.checkins, { [key]: it.level }); e.updatedAt = new Date().toISOString();
          App.saveEntry(e); const i = S.journal.findIndex((x) => x.id === e.id); if (i >= 0) S.journal[i] = e;
        }
      }
      if (items.length) { App.recompute(); App.render(); }
    } finally { inboxBusy = false; }
  };

  async function registerMorning() {
    if (!reg || !('periodicSync' in reg)) return 'unsupported';
    try {
      const st = await navigator.permissions.query({ name: 'periodic-background-sync' });
      if (st.state !== 'granted') return 'not-allowed';
      if (S.settings.notify.morning) await reg.periodicSync.register('sillage-morning', { minInterval: 12 * 3600 * 1000 });
      else await reg.periodicSync.unregister('sillage-morning');
      return 'ok';
    } catch (e) { return 'error'; }
  }
  let morningState = 'unknown';

  App.afterBoot = async function () {
    if (!hosted) return;
    await App.autoLocate(false);
    await App.processInbox();
    morningState = await registerMorning();
    // Morning pick: once a day, the first time the app runs in the morning (periodic sync covers mornings you don't open it, where supported)
    if (App.canNotify() && S.settings.notify.morning && S.rec && S.rec.primary) {
      const n = await App.store().getNotify(); const h = new Date().getHours();
      if (n.date !== S.day.date && h >= 5 && h < 12) { await App.notifyPick(S.rec.primary); await App.store().setNotify(Object.assign(n, { date: S.day.date })); }
    }
  };
  App.onVisible = () => { if (!hosted) return; App.autoLocate(false); App.processInbox(); };

  // ---------- Settings section ----------
  App.phoneSection = function () {
    if (!hosted) return `<section class="card stack" id="sec-phone"><div class="card-head"><h2>Phone & watch</h2></div><p class="small dim">GPS, live weather, offline use and watch notifications work in the installed Sillage app. Inside Claude they’re blocked by the viewer.</p></section>`;
    const perm = typeof Notification === 'undefined' ? 'unsupported' : Notification.permission;
    const nset = S.settings.notify || {};
    return `<section class="card stack" id="sec-phone"><div class="card-head"><h2>Phone & watch</h2><span class="muted xs">${standalone() ? 'Installed app' : 'In the browser'}</span></div>
      ${standalone() ? '' : installEvt ? '<button class="btn primary" data-act="pwa-install">Install Sillage on this phone</button>' : '<p class="small dim">To install: open Chrome’s ⋮ menu → “Add to Home screen” → Install.</p>'}
      <div class="row between"><span>Notifications</span>${perm === 'granted' ? '<span class="tag on-tag">On</span>' : perm === 'denied' ? '<span class="tag">Blocked in phone settings</span>' : perm === 'unsupported' ? '<span class="tag">Not supported here</span>' : '<button class="btn sm primary" data-act="pwa-notify">Turn on</button>'}</div>
      <label class="switch"><span>Morning pick to my watch<br><span class="muted xs">${morningState === 'ok' ? 'Also arrives on mornings you don’t open the app (timing set by Android, roughly daily).' : 'Arrives the first time you open Sillage each morning.'}</span></span><input type="checkbox" data-ch="notify" data-k="morning" id="n-morning" ${nset.morning !== false ? 'checked' : ''}></label>
      <label class="switch"><span>“Wearing” card with check-in buttons<br><span class="muted xs">Tap “Still noticeable” or “Faint / gone” on your watch; it logs a check-in for that hour.</span></span><input type="checkbox" data-ch="notify" data-k="wearing" id="n-wearing" ${nset.wearing !== false ? 'checked' : ''}></label>
      <div class="row"><button class="btn sm" data-act="send-watch">Send today’s pick now</button></div>
      <p class="muted xs">Your Galaxy Watch shows these through phone notifications. In the Galaxy Wearable app, make sure notifications for Sillage (or Chrome) are allowed on the watch.</p></section>`;
  };
  A['pwa-install'] = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; App.render(); };
  A['pwa-notify'] = async () => { const p = await Notification.requestPermission(); App.render(); if (p === 'granted') { morningState = await registerMorning(); App.toast('Notifications on.'); } };
  X.notify = async (el) => { S.settings.notify = Object.assign({}, S.settings.notify, { [el.dataset.k]: el.checked }); App.saveSettings(); if (el.dataset.k === 'morning') morningState = await registerMorning(); };
})(typeof window !== 'undefined' ? window : globalThis);

// ---- boot.js ----
/* Shell markup + start */
(function (G) {
  const FPI = G.FPI, App = FPI.App, icon = App.icon;
  const NAV = [['today', 'Today'], ['collection', 'Collection'], ['discover', 'Discover'], ['weather', 'Weather'], ['journal', 'Journal'], ['insights', 'Insights'], ['learn', 'Learn'], ['prefs', 'Settings']];
  function shell() {
    const root = document.getElementById('shell');
    root.innerHTML = `<div class="app">
      <nav class="rail" aria-label="Main"><span class="wordmark">Sillage <em>·</em> <span class="wm-sub">fragrance intelligence</span></span>
        ${NAV.map(([k, l]) => `<a href="#${k}" data-nav="${k}">${icon(k)}<span>${l}</span></a>`).join('')}
        <div class="rail-foot muted xs"><span id="save-dot-rail" class="save-dot"></span> <span id="save-label-rail"></span></div></nav>
      <div style="min-width:0">
        <header class="topbar"><div class="topbar-in"><span class="wordmark">Sillage</span><span class="spacer"></span>
          <span id="save-dot" class="save-dot" aria-hidden="true"></span>
          <a class="icon-btn nav-extra" href="#learn" data-nav="learn" aria-label="Learn">${icon('learn')}</a>
          <a class="icon-btn nav-extra" href="#prefs" data-nav="prefs" aria-label="Settings">${icon('prefs')}</a></div></header>
        <main><div id="view"></div></main>
      </div></div>
      <nav class="tabbar" aria-label="Sections"><div class="tabbar-in">${NAV.slice(0, 6).map(([k, l]) => `<a class="tab" href="#${k}" data-nav="${k}">${icon(k)}<span>${l}</span></a>`).join('')}</div></nav>
      <div id="sheet-root"></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div><div id="tip" class="tip" hidden></div>`;
  }
  const origRender = App.render;
  App.render = function (s) {
    origRender(s);
    const st = App.store && App.store();
    const lab = document.getElementById('save-label-rail'), dot = document.getElementById('save-dot-rail');
    if (st && lab) { lab.textContent = st.label; dot.className = 'save-dot ' + (st.mode === 'db' ? '' : st.mode); }
  };
  function start() { shell(); App.boot(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})(window);

</script>
